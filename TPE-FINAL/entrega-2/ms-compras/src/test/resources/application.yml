spring:
  application:
    name: ms-compras
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  datasource:
    url: jdbc:h2:mem:compras_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

servicios:
  reservas:
    url: http://localhost:18082
  pagos:
    url: http://localhost:18084
  eventos:
    url: http://localhost:18081

compras:
  recuperacion:
    # en los tests el job se dispara a mano
    intervalo-ms: 3600000
    segundos-de-gracia: 0

outbox:
  publicar: false
bitacora:
  enviar: false

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 10ms
        retry-exceptions:
          - com.ticketya.compras.exception.ServicioNoDisponibleException
        ignore-exceptions:
          - com.ticketya.compras.exception.RespuestaServicioException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - com.ticketya.compras.exception.CircuitoAbiertoException
    instances:
      pagos:
        base-config: default
      reservas:
        base-config: default
      eventos:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        record-exceptions:
          - com.ticketya.compras.exception.ServicioNoDisponibleException
        ignore-exceptions:
          - com.ticketya.compras.exception.RespuestaServicioException
    instances:
      pagos:
        base-config: default
      eventos:
        base-config: default
