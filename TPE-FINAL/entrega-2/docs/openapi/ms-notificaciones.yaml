openapi: 3.0.1
info:
  title: TicketYa - ms-notificaciones
  description: |
    Notificaciones por email (funcionalidad 11): confirmación de compra, cancelación o
    cambio de fecha de un evento, y aviso cuando un artista favorito se presenta en la
    ciudad del cliente. Se generan de forma **asincrónica** a partir de los mensajes de
    RabbitMQ y se guardan en **MongoDB**. El proveedor de email es un mock protegido con
    reintentos y circuit breaker; lo que no se puede enviar queda PENDIENTE y se reintenta.
  version: 2.0.0
servers:
- url: http://localhost:8080/api
  description: A través del API Gateway
- url: http://localhost:8088
  description: Directo al microservicio
security:
- bearerAuth: []
paths:
  /notificaciones:
    get:
      tags:
      - Notificaciones
      summary: Mis notificaciones (cualquier usuario logueado)
      description: Bandeja de notificaciones del usuario, de la más nueva a la más vieja, con su estado de envío.
      operationId: mias
      parameters:
      - name: limite
        in: query
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacionResponse'
components:
  schemas:
    NotificacionResponse:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum:
          - COMPRA_CONFIRMADA
          - EVENTO_CANCELADO
          - EVENTO_REPROGRAMADO
          - ARTISTA_FAVORITO
        canal:
          type: string
        eventoId:
          type: integer
          format: int64
        asunto:
          type: string
        mensaje:
          type: string
        estado:
          type: string
          enum:
          - PENDIENTE
          - ENVIADA
          - FALLIDA
          - DESCARTADA
        intentos:
          type: integer
          format: int32
        creada:
          type: string
          format: date-time
        enviada:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
