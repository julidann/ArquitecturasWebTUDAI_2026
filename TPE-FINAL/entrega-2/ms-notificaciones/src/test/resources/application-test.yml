spring:
  application:
    name: ms-notificaciones
  rabbitmq:
    listener:
      simple:
        auto-startup: false
notificaciones:
  max-intentos: 2
  # en los tests el reenvio se dispara a mano
  intervalo-reenvio-ms: 3600000
resilience4j:
  retry:
    instances:
      proveedor:
        wait-duration: 1ms
      servicios:
        wait-duration: 1ms
        enable-exponential-backoff: false
