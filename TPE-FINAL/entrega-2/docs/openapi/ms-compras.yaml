openapi: 3.0.1
info:
  title: TicketYa - ms-compras
  description: |
    Orquesta la compra: valida la reserva, cobra a través de ms-pagos, confirma la
    reserva en ms-reservas y emite las entradas con su código QR. También gestiona
    las devoluciones y la cancelación de eventos.

    `POST /compras` exige el encabezado **Idempotency-Key**: si el cliente reintenta
    (por ejemplo, por un corte de conexión) con la misma clave, recibe el resultado
    original y no se le cobra dos veces.

    **Entrega 2:** control de acceso con QR (`/accesos`), reportes para organizadores
    (`/reportes`), resiliencia ante la pasarela (reintentos, circuit breaker y fallback)
    y recuperación automática de compras que quedaron a mitad de camino (saga).
    Autenticación con JWT en el gateway (`Authorization: Bearer`).
  version: 2.0.0
servers:
- url: http://localhost:8080/api
  description: A través del API Gateway
- url: http://localhost:8083
  description: Directo al microservicio
security:
- bearerAuth: []
tags:
- name: Devoluciones
  description: Resolución de solicitudes de devolución (administradores)
- name: Entradas
  description: Entradas emitidas, su código QR y pedidos de devolución
- name: Control de acceso
  description: Validación del QR en el ingreso al evento
- name: Reportes
  description: Reportes de ventas para organizadores
- name: Compras
  description: Pago de una reserva y emisión de entradas
- name: Interno
  description: Endpoints entre microservicios (no expuestos por el gateway)
paths:
  /internal/eventos/{eventoId}/cancelacion:
    post:
      tags:
      - Interno
      summary: '[Interno] Procesar la cancelación de un evento (lo invoca ms-eventos)'
      description: Pasa todas las entradas válidas a CANCELADA y pide el reintegro de cada una. Idempotente.
      operationId: cancelar
      parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelacionEventoRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelacionEventoResponse'
  /entradas/{id}/devolucion:
    post:
      tags:
      - Entradas
      summary: Solicitar la devolución de una entrada
      description: Se puede pedir hasta 72 horas antes del evento. Queda PENDIENTE hasta que un administrador la resuelva.
      operationId: solicitarDevolucion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevolucionRequest'
      responses:
        '409':
          description: La entrada no está válida o ya tiene una solicitud pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDevolucionResponse'
        '422':
          description: Faltan menos de 72 horas para el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La entrada es de otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /devoluciones/{id}/rechazar:
    post:
      tags:
      - Devoluciones
      summary: Rechazar una devolución (ADMIN)
      operationId: rechazar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolucionRequest'
      responses:
        '409':
          description: La solicitud ya fue resuelta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No es administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /devoluciones/{id}/aprobar:
    post:
      tags:
      - Devoluciones
      summary: Aprobar una devolución (ADMIN)
      description: Libera el lugar en ms-reservas y pide el reintegro del precio de la entrada a ms-pagos.
      operationId: aprobar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Devolución aprobada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDevolucionResponse'
        '409':
          description: La solicitud ya fue resuelta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No es administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ms-reservas o ms-pagos no disponibles (se puede reintentar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /compras:
    get:
      tags:
      - Compras
      summary: Mis compras
      operationId: mias_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraResponse'
    post:
      tags:
      - Compras
      summary: Pagar una reserva
      description: |-
        Cobra la reserva y, si el pago se aprueba, emite una entrada con código QR por cada lugar.
        Hay que enviar una **Idempotency-Key** única por intento de compra (ej: un UUID generado por la app).
        Si se reenvía la misma clave se devuelve el resultado original (200) sin volver a cobrar; si la
        compra había quedado en ERROR, se reintenta.
      operationId: comprar
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        example: 3f6c1b8e-2a41-4d0c-9b7e-5e2f0a1c9d33
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraRequest'
        required: true
      responses:
        '422':
          description: La Idempotency-Key ya se usó para otra compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La reserva es de otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Pago aprobado, entradas emitidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '409':
          description: Reserva vencida/liberada, compra en proceso o ya existe una compra para la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Pago rechazado; la reserva se liberó (el cuerpo es la compra RECHAZADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '404':
          description: No existe la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Falló otro servicio; la compra queda en ERROR y se puede reintentar con la misma clave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
        '200':
          description: 'Reintento con la misma Idempotency-Key: resultado original'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraResponse'
  /accesos/validar:
    post:
      tags:
      - Control de acceso
      summary: Validar el QR de una entrada (ACCESO)
      description: Si la entrada existe, es del evento y está VALIDA se marca UTILIZADA y se deja pasar. Un QR no puede ingresar
        dos veces, aunque se escanee en dos puertas al mismo tiempo.
      operationId: validar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionAccesoRequest'
        required: true
      responses:
        '409':
          description: 'Rechazado: YA_UTILIZADA, OTRO_EVENTO, DEVUELTA o CANCELADA (el cuerpo dice el motivo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionAccesoResponse'
        '404':
          description: 'INEXISTENTE: el QR no corresponde a ninguna entrada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionAccesoResponse'
        '200':
          description: 'PERMITIDO: puede ingresar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionAccesoResponse'
  /reportes/eventos/{eventoId}:
    get:
      tags:
      - Reportes
      summary: Reporte de un evento (ORGANIZADOR dueño o ADMIN)
      description: 'Por sector: vendidas, devueltas, canceladas, vigentes, ingresaron, % de ocupación y recaudación neta.
        Se calcula en el momento (no se cachea).'
      operationId: reporte
      parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteEventoResponse'
        '403':
          description: No es el organizador del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/eventos/{eventoId}/compradores:
    get:
      tags:
      - Interno
      summary: '[Interno] Compradores de un evento (lo usa ms-notificaciones)'
      description: Ids de los usuarios con entradas válidas, utilizadas o canceladas del evento.
      operationId: compradores
      parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
  /entradas:
    get:
      tags:
      - Entradas
      summary: Mis entradas
      operationId: mias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaResponse'
  /entradas/{id}:
    get:
      tags:
      - Entradas
      summary: Detalle de una entrada
      operationId: obtener
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: La entrada es de otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /entradas/{id}/qr:
    get:
      tags:
      - Entradas
      summary: Imagen PNG del código QR de la entrada
      operationId: qr
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Imagen PNG
          content:
            image/png: {}
  /devoluciones:
    get:
      tags:
      - Devoluciones
      summary: Listar solicitudes de devolución
      description: Un ADMIN ve todas; cualquier otro rol ve solo las propias.
      operationId: listar
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDIENTE
          - APROBADA
          - RECHAZADA
        example: PENDIENTE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudDevolucionResponse'
  /compras/{id}:
    get:
      tags:
      - Compras
      summary: Detalle de una compra (con sus entradas)
      operationId: obtener_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: La compra es de otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /accesos/eventos/{eventoId}:
    get:
      tags:
      - Control de acceso
      summary: Resumen de ingresos de un evento (ACCESO, ORGANIZADOR, ADMIN)
      operationId: resumen
      parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenAccesoResponse'
components:
  schemas:
    CancelacionEventoRequest:
      type: object
      properties:
        motivo:
          type: string
    CancelacionEventoResponse:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
          example: 1
        entradasCanceladas:
          type: integer
          format: int32
          example: 120
        reintegrosSolicitados:
          type: integer
          format: int32
          example: 120
        reintegrosFallidos:
          type: integer
          description: Reintegros que fallaron; se reprocesan si se vuelve a llamar
          format: int32
          example: 0
        compradoresNotificados:
          type: integer
          format: int32
          example: 45
    DevolucionRequest:
      type: object
      properties:
        motivo:
          maxLength: 500
          minLength: 0
          type: string
          example: No puedo asistir por un viaje de trabajo
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
          example: 409
        error:
          type: string
          example: Conflict
        mensaje:
          type: string
          example: La devolución solo se puede pedir hasta 72 horas antes del evento
        path:
          type: string
          example: /entradas/31/devolucion
        detalles:
          type: array
          items:
            type: string
      description: Formato comun de error de todos los microservicios
    SolicitudDevolucionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        entradaId:
          type: integer
          format: int64
          example: 31
        eventoId:
          type: integer
          format: int64
          example: 1
        usuarioId:
          type: integer
          format: int64
          example: 100
        montoAReintegrar:
          type: number
          example: 45000.0
        motivo:
          type: string
          example: No puedo asistir
        estado:
          type: string
          example: PENDIENTE
          enum:
          - PENDIENTE
          - APROBADA
          - RECHAZADA
        solicitadaEn:
          type: string
          format: date-time
        resueltaEn:
          type: string
          format: date-time
        resueltaPor:
          type: integer
          format: int64
          example: 1
        observacion:
          type: string
          example: 'null'
        reintegroId:
          type: integer
          format: int64
          example: 4
    ResolucionRequest:
      type: object
      properties:
        observacion:
          maxLength: 500
          minLength: 0
          type: string
          example: La entrada fue transferida, no corresponde devolución
    CompraRequest:
      required:
      - medioPago
      - reservaId
      type: object
      properties:
        reservaId:
          type: integer
          description: Reserva PENDIENTE obtenida en POST /reservas
          format: int64
          example: 15
        medioPago:
          $ref: '#/components/schemas/DatosMedioPago'
    DatosMedioPago:
      required:
      - tipo
      type: object
      properties:
        tipo:
          type: string
          example: TARJETA_CREDITO
          enum:
          - TARJETA_CREDITO
          - TARJETA_DEBITO
          - MERCADO_PAGO
        numeroTarjeta:
          pattern: \d{13,19}
          type: string
          example: '4509953566233704'
        titular:
          type: string
          example: Juan Perez
        cuotas:
          maximum: 12
          minimum: 1
          type: integer
          format: int32
          example: 1
      description: 'Medio de pago. Tarjetas de prueba del mock: terminada en 0002 = rechazada, cualquier otra = aprobada.'
    CompraResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 21
        usuarioId:
          type: integer
          format: int64
          example: 100
        reservaId:
          type: integer
          format: int64
          example: 15
        eventoId:
          type: integer
          format: int64
          example: 1
        nombreEvento:
          type: string
          example: Los Piojos - Ritual 2026
        cantidad:
          type: integer
          format: int32
          example: 2
        montoTotal:
          type: number
          example: 90000.0
        medioPago:
          type: string
          example: TARJETA_CREDITO
          enum:
          - TARJETA_CREDITO
          - TARJETA_DEBITO
          - MERCADO_PAGO
        ultimosDigitos:
          type: string
          example: '3704'
        pagoId:
          type: integer
          format: int64
          example: 8
        estado:
          type: string
          example: APROBADA
          enum:
          - PENDIENTE
          - APROBADA
          - RECHAZADA
          - ERROR
        detalle:
          type: string
          description: Motivo de rechazo o error, si lo hay
          example: 'null'
        creadaEn:
          type: string
          format: date-time
        entradas:
          type: array
          items:
            $ref: '#/components/schemas/EntradaResponse'
    EntradaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 31
        compraId:
          type: integer
          format: int64
          example: 21
        eventoId:
          type: integer
          format: int64
          example: 1
        nombreEvento:
          type: string
          example: Los Piojos - Ritual 2026
        fechaEvento:
          type: string
          format: date-time
        sectorId:
          type: integer
          format: int64
          example: 3
        sector:
          type: string
          example: Platea Baja
        asientoId:
          type: integer
          format: int64
          example: 57
        fila:
          type: string
          example: C
        numero:
          type: integer
          format: int32
          example: 12
        precio:
          type: number
          example: 45000.0
        codigoQr:
          type: string
          example: 6f1c2a9e-3d4b-4f7a-9c1e-2b8d5e0a7f31
        estado:
          type: string
          example: VALIDA
          enum:
          - VALIDA
          - DEVUELTA
          - CANCELADA
          - UTILIZADA
        emitidaEn:
          type: string
          format: date-time
    ValidacionAccesoRequest:
      required:
      - codigoQr
      - eventoId
      type: object
      properties:
        codigoQr:
          type: string
          description: Contenido del QR escaneado
          example: 1f0b6c2e-8f5a-4d7e-9a43-2b1d7c9e0a11
        eventoId:
          type: integer
          description: Evento en el que está trabajando el lector
          format: int64
          example: 1
        puerta:
          type: string
          example: Puerta 3
    ValidacionAccesoResponse:
      type: object
      properties:
        permitido:
          type: boolean
          description: 'true: puede pasar'
          example: true
        resultado:
          type: string
          example: PERMITIDO
        mensaje:
          type: string
          example: Entrada válida. ¡Bienvenido!
        entradaId:
          type: integer
          format: int64
          example: 15
        sector:
          type: string
          example: Platea
        fila:
          type: string
          example: C
        numero:
          type: integer
          format: int32
          example: 12
        ingresoAnterior:
          type: string
          description: 'Si ya se había usado: cuándo ingresó'
          format: date-time
    ReporteEventoResponse:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
          example: 1
        nombreEvento:
          type: string
          example: Los Piojos - Ritual 2026
        organizadorId:
          type: integer
          format: int64
          example: 10
        generadoEn:
          type: string
          format: date-time
        ocupacionDisponible:
          type: boolean
          description: 'false si ms-reservas no respondió: falta la capacidad y la ocupación'
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/Sector'
        totales:
          $ref: '#/components/schemas/Totales'
      description: Reporte de ventas de un evento (funcionalidad 12)
    Sector:
      type: object
      properties:
        sectorId:
          type: integer
          format: int64
          example: 3
        nombre:
          type: string
          example: Platea Baja
        capacidad:
          type: integer
          description: Capacidad del sector
          format: int32
          example: 200
        vendidas:
          type: integer
          description: Entradas emitidas (incluye las que después se devolvieron o cancelaron)
          format: int64
          example: 150
        devueltas:
          type: integer
          format: int64
          example: 4
        canceladas:
          type: integer
          description: Cancelaciones por cancelación del evento
          format: int64
          example: 0
        vigentes:
          type: integer
          description: Entradas vigentes (válidas + ya utilizadas)
          format: int64
          example: 146
        ingresaron:
          type: integer
          description: Personas que ya ingresaron con esa entrada
          format: int64
          example: 0
        porcentajeOcupacion:
          type: number
          description: vigentes / capacidad
          format: double
          example: 73.0
        recaudacion:
          type: number
          description: Recaudación neta (sin lo reintegrado)
          example: 6570000.0
        reintegrado:
          type: number
          description: Monto reintegrado por devoluciones y cancelaciones
          example: 180000.0
    Totales:
      type: object
      properties:
        capacidad:
          type: integer
          format: int32
        vendidas:
          type: integer
          format: int64
        devueltas:
          type: integer
          format: int64
        canceladas:
          type: integer
          format: int64
        vigentes:
          type: integer
          format: int64
        ingresaron:
          type: integer
          format: int64
        porcentajeOcupacion:
          type: number
          format: double
        recaudacion:
          type: number
        reintegrado:
          type: number
    ResumenAccesoResponse:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
          example: 1
        entradasVigentes:
          type: integer
          description: Entradas emitidas que siguen vigentes (válidas + utilizadas)
          format: int64
          example: 4500
        ingresaron:
          type: integer
          description: Personas que ya ingresaron
          format: int64
          example: 3120
        rechazos:
          type: integer
          description: Escaneos rechazados (QR repetido, de otro evento, devuelto, etc.)
          format: int64
          example: 17
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
